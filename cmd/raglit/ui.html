<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raglit review</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --ink:#1a1d21; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --err:#dc2626; --run:#2563eb;
    --vision:#7c3aed; --text-eng:#0891b2; --chip:#eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --panel:#171a21; --ink:#e6e8eb; --muted:#9aa4b2; --line:#262b34;
      --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --run:#3b82f6;
      --vision:#a78bfa; --text-eng:#22d3ee; --chip:#20242d;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; gap:12px; align-items:center;
    padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:650; letter-spacing:.2px; }
  header h1 span { color:var(--muted); font-weight:400; }
  .grow { flex:1; }
  select, button { font:inherit; color:inherit; background:var(--panel);
    border:1px solid var(--line); border-radius:7px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  label.toggle { display:flex; align-items:center; gap:6px; color:var(--muted); cursor:pointer; }
  main { padding:16px; max-width:1200px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card .n { font-size:22px; font-weight:650; }
  .card .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
    margin:22px 0 8px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  td.url { max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  td.actions { white-space:nowrap; text-align:right; }
  td.actions button { padding:3px 9px; font-size:12px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:20px; font-size:11px; font-weight:600;
    background:var(--chip); }
  .badge.pending { color:var(--warn); } .badge.running { color:var(--run); }
  .badge.done { color:var(--ok); } .badge.error { color:var(--err); }
  .badge.vision { color:#fff; background:var(--vision); }
  .badge.text { color:#fff; background:var(--text-eng); }
  .badge.llm { color:#fff; background:var(--vision); }
  .badge.offline { color:var(--ink); background:var(--chip); border:1px solid var(--line); }
  .eng { color:#fff; }
  /* job stages */
  tr.stages td { padding:0 12px 10px 34px; background:var(--bg); }
  .stagelist { display:flex; flex-wrap:wrap; gap:6px; }
  .stage { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:7px;
    border:1px solid var(--line); background:var(--panel); font-size:12px; }
  .stage .nm { font-weight:600; }
  .stage .eng2 { color:var(--muted); }
  .stage .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); }
  .stage.error .dot { background:var(--err); }
  .stage.skipped .dot { background:var(--muted); }
  .stage.error { border-color:var(--err); }
  .expand { cursor:pointer; user-select:none; color:var(--muted); }
  .expand:hover { color:var(--accent); }
  .muted { color:var(--muted); }
  .err { color:var(--err); font-size:12px; white-space:pre-wrap; }
  .empty { padding:22px; text-align:center; color:var(--muted); }
  /* documents + review */
  .doc-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line);
    cursor:pointer; }
  .doc-row:last-child { border-bottom:none; }
  .doc-row:hover { background:var(--chip); }
  .doc-row.sel { background:var(--chip); }
  .doc-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .doc-title small { color:var(--muted); display:block; overflow:hidden; text-overflow:ellipsis; }
  .pagecard { display:grid; grid-template-columns:minmax(0,320px) 1fr; gap:16px; padding:14px;
    border-bottom:1px solid var(--line); }
  @media (max-width:720px){ .pagecard { grid-template-columns:1fr; } }
  .pagecard:last-child { border-bottom:none; }
  /* min-height so a slow or failed page image still occupies space rather than
     collapsing to a 2px line that reads as "there is no image". */
  .pagecard img { width:100%; min-height:80px; border:1px solid var(--line); border-radius:8px;
    background:#fff; cursor:zoom-in; }
  .pagehead { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .pagehead .n { font-weight:650; }
  .ptext { white-space:pre-wrap; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; max-height:340px;
    overflow:auto; }
  .reocr { margin-top:8px; }
  .reocr .out { margin-top:8px; }
  dialog { border:none; border-radius:12px; padding:0; max-width:92vw; max-height:92vh; background:transparent; }
  dialog img { max-width:92vw; max-height:88vh; border-radius:10px; }
  dialog::backdrop { background:rgba(0,0,0,.72); }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:var(--bg); padding:9px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
.tabs { display:flex; gap:2px; margin:18px 0 12px; border-bottom:1px solid var(--line); }
.tabs button { background:none; border:0; border-bottom:2px solid transparent; color:var(--muted);
  padding:8px 14px; cursor:pointer; font-size:14px; }
.tabs button.on { color:var(--fg); border-bottom-color:#5b9dd9; }
.subtabs { display:flex; gap:2px; padding:0 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.subtabs button { background:none; border:0; border-bottom:2px solid transparent; color:var(--muted);
  padding:7px 11px; cursor:pointer; font-size:13px; }
.subtabs button.on { color:var(--fg); border-bottom-color:#5b9dd9; }
.dpane { padding:12px 14px; }
.dpane pre { white-space:pre-wrap; word-break:break-word; margin:0; line-height:1.5; }
.seen td { padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
.seen th { padding:6px 8px; text-align:left; font-size:12px; color:var(--muted); }
.num { text-align:right; font-variant-numeric:tabular-nums; }
.prov { border-left:3px solid #b8860b; padding:8px 12px; margin:0 0 12px; font-size:13px; line-height:1.5; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; }
.kv dt { color:var(--muted); }
.kv dd { margin:0; }
.split { display:grid; grid-template-columns:minmax(240px,340px) minmax(0,1fr); gap:16px; align-items:start; }
/* Mobile: one column, and the list gives way to the document once one is open.
   A 340px sidebar beside a document on a phone leaves neither readable. */
@media (max-width:820px){
  .split { grid-template-columns:minmax(0,1fr); }
  .split.reading > #docs { display:none; }
  header { flex-wrap:wrap; gap:8px; }
  header select { max-width:100%; }
  .tabs, .subtabs { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tabs button, .subtabs button { white-space:nowrap; }
  .cards { grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); }
  .seen th:nth-child(5), .seen td:nth-child(5) { display:none; }
}
.backlink { display:none; background:none; border:0; color:#5b9dd9; cursor:pointer; padding:0 0 6px; font-size:13px; }
@media (max-width:820px){ .backlink { display:inline-block; } }
.dpane img { max-width:100%; height:auto; }
.docacts { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px; }
.docacts a, .docacts button { font-size:13px; }
.docacts button { background:var(--bg); color:var(--fg); border:1px solid var(--line);
  border-radius:6px; padding:3px 9px; cursor:pointer; }
.docacts button:disabled { opacity:.55; cursor:default; }
.searchbar { display:flex; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.searchbar input { flex:1 1 320px; min-width:0; background:var(--bg); color:var(--fg);
  border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:14px; }
.searchbar select, .searchbar button { background:var(--bg); color:var(--fg);
  border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
.hit { padding:12px 14px; border-bottom:1px solid var(--line); }
.hit:last-child { border-bottom:none; }
.hit a { font-weight:600; }
.hit .snip { margin-top:4px; font-size:13px; line-height:1.5; }
.hit .meta { font-size:11px; color:var(--muted); margin-top:3px; }
.hit mark { background:#2b3a55; color:inherit; }
</style>
</head>
<body>
<header>
  <h1>raglit <span>review</span></h1>
  <select id="index" title="index"></select>
  <div class="grow"></div>
  <label class="toggle"><input type="checkbox" id="auto" checked> auto-refresh</label>
  <button id="refresh">Refresh</button>
</header>
<main>
  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="on">Dashboard</button>
    <button data-tab="jobs">Ingest jobs</button>
    <button data-tab="documents">Documents</button>
    <button data-tab="search">Search</button>
  </nav>

  <section data-pane="dashboard">
    <div class="cards" id="cards"></div>
  </section>

  <section data-pane="jobs" hidden>
    <div class="panel"><table>
      <thead><tr><th></th><th>#</th><th>State</th><th>Mode</th><th>Target</th><th>Frags</th><th>ETA</th><th>Detail</th><th></th></tr></thead>
      <tbody id="jobs"></tbody>
    </table></div>
  </section>

  <section data-pane="search" hidden>
    <div class="panel">
      <form id="searchForm" class="searchbar">
        <input id="q" type="search" placeholder="search this index — words from the document, not a question" autocomplete="off">
        <select id="smode">
          <option value="bm25">bm25 — exact words</option>
          <option value="hybrid">hybrid — words + meaning</option>
          <option value="vec">vector — meaning only</option>
        </select>
        <button type="submit">Search</button>
      </form>
      <div id="results"><div class="empty">Nothing searched yet.</div></div>
    </div>
  </section>

  <section data-pane="documents" hidden>
    <div class="split" id="split">
      <div class="panel" id="docs"><div class="empty">loading…</div></div>
      <div class="panel" id="detail"><div class="empty">Select a document.</div></div>
    </div>
  </section>
</main>

<dialog id="lightbox"><img id="lightimg" alt=""></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const el = (t,c,txt) => { const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; };
let curIndex = "default", curDoc = null;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
async function getJSON(u){ const r=await fetch(u); if(!r.ok) throw new Error((await r.text())||r.status); return r.json(); }
async function post(u,body){ const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error((await r.text())||r.status); return r.json(); }
const qi = () => "index="+encodeURIComponent(curIndex);
const esc = s => (s==null?"":String(s));
function ago(ns){ if(!ns) return ""; const s=(Date.now()-ns/1e6)/1000; if(s<60)return Math.round(s)+"s ago";
  if(s<3600)return Math.round(s/60)+"m ago"; if(s<86400)return Math.round(s/3600)+"h ago"; return Math.round(s/86400)+"d ago"; }
function eta(s){ if(!s) return ""; if(s<90)return "~"+Math.round(s)+"s"; return "~"+Math.round(s/60)+"m"; }

// ── routing ─────────────────────────────────────────────────────────────────
// Tabs are ROUTES, in the hash. Three things follow that a click handler could
// not give you: a document is linkable — you can paste somebody the deed you are
// looking at — the back button walks where you have been rather than leaving the
// page, and a reload lands where you were instead of at the top.
//
// The hash rather than the path because this page is one embedded document
// served at exactly "/", and path routing would need the daemon to catch-all
// every unknown URL — which would swallow the attest mount and every API route
// with one typo.
//
//   #/dashboard
//   #/jobs
//   #/documents
//   #/documents/<index>/<path>[/pages|transcript|seen|attest]
const TABS = ["dashboard","jobs","documents","search"];
let route = {tab:"dashboard", doc:null, sub:"pages"};

function parseHash(){
  const raw = (location.hash||"").replace(/^#\/?/,"");
  const parts = raw.split("/").filter(Boolean).map(decodeURIComponent);
  if(!parts.length) return {tab:"dashboard", doc:null, sub:"pages"};
  const tab = TABS.includes(parts[0]) ? parts[0] : "dashboard";
  if(tab!=="documents" || parts.length<3) return {tab, doc:null, sub:"pages"};
  // documents / <index> / <path> [/ <sub>]. The path is one segment; anything
  // after it that names a sub-tab is one, and anything else is a hand-typed or
  // older link whose path got split — rejoin it rather than 404 on a URL that
  // looks right to a person.
  const subs = ["pages","transcript","seen","attest","history"];
  let rest = parts.slice(2), sub = "pages";
  if(rest.length>1 && subs.includes(rest[rest.length-1])) sub = rest.pop();
  let doc = rest.join("/");
  // A pasted link that lost its leading slash still points at a real document.
  if(doc && !doc.startsWith("/") && rest.length>1) doc = "/"+doc;
  return {tab, index:parts[1], doc, sub};
}

// The path is ONE encoded segment, not a run of them.
//
// Splitting it on "/" and re-joining looked tidier and silently ate the leading
// slash of an absolute path — "/home/nthalk/…" came back as "home/nthalk/…" —
// so every deep link to a document in this index resolved to a path that does
// not exist. Documents are stored by absolute path, so that was all of them.
function hashFor(tab, doc, sub){
  if(tab!=="documents" || !doc) return "#/"+tab;
  return "#/documents/"+encodeURIComponent(curIndex)+"/"+
    encodeURIComponent(doc)+"/"+(sub||"pages");
}

function go(tab, doc, sub){
  const h = hashFor(tab, doc, sub);
  if(location.hash === h) applyRoute(); else location.hash = h;
}

async function applyRoute(){
  const r = parseHash();
  route = r;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===r.tab));
  document.querySelectorAll("[data-pane]").forEach(p=>{ p.hidden = p.dataset.pane!==r.tab; });
  if(r.tab!=="documents") return;
  if(r.index && r.index!==curIndex){
    curIndex = r.index;
    const sel=$("#index"); if(sel) sel.value=curIndex;
    await loadDocs();
  }
  // `reading` is what collapses the list on a phone: a 340px sidebar beside a
  // document leaves neither readable.
  $("#split").classList.toggle("reading", !!r.doc);
  if(r.doc){
    if(r.doc!==curDoc){ curDoc=r.doc; markSelected(); await loadReview(); }
    else { detailTab=r.sub; await loadReview(); }
  } else {
    curDoc=null; markSelected();
    $("#detail").innerHTML='<div class="empty">Select a document.</div>';
  }
}

async function runSearch(){
  const q=$("#q").value.trim();
  const box=$("#results");
  if(!q){ box.innerHTML='<div class="empty">Nothing searched yet.</div>'; return; }
  box.innerHTML='<div class="empty">searching…</div>';
  let d;
  try{ d = await getJSON("/search?"+qi()+"&mode="+encodeURIComponent($("#smode").value)+
    "&n=25&q="+encodeURIComponent(q)); }
  catch(e){ box.innerHTML=""; box.appendChild(el("div","empty","Search failed: "+esc(e.message))); return; }
  const hits=d.hits||[];
  box.innerHTML="";
  if(!hits.length){ box.appendChild(el("div","empty","No hits. bm25 matches WORDS — try the words the document would use.")); return; }
  for(const h of hits){
    const card=el("div","hit");
    // A hit links into the document view rather than opening a dead end. The
    // point of finding a passage is to go and look at what it came from.
    const a=el("a",null,h.title||h.doc_id.split("/").pop());
    a.href=hashFor("documents", h.doc_id, "transcript");
    card.appendChild(a);
    const snip=el("div","snip");
    // The snippet is server text; mark the query words rather than trusting any
    // markup in it.
    snip.textContent=h.snippet||"";
    card.appendChild(snip);
    const meta=el("div","meta");
    meta.textContent=[h.page?"page "+h.page:null, "score "+(h.score||0).toFixed(2), h.doc_id]
      .filter(Boolean).join("  ·  ");
    card.appendChild(meta);
    box.appendChild(card);
  }
}

function markSelected(){
  document.querySelectorAll(".doc-row").forEach(row=>
    row.classList.toggle("sel", row.dataset.path===curDoc));
}

async function loadIndexes(){
  const d = await getJSON("/indexes");
  const sel = $("#index"); sel.innerHTML="";
  (d.indexes||[]).forEach(ix=>{ const o=el("option"); o.value=ix.name;
    o.textContent=`${ix.name} — ${ix.documents} docs / ${ix.fragments} frags`; sel.appendChild(o); });
  if(!sel.querySelector(`option[value="${curIndex}"]`) && sel.options.length) curIndex=sel.options[0].value;
  sel.value=curIndex;
}

async function loadStatus(){
  const s = await getJSON("/status?"+qi());
  const cards=[["documents",s.documents],["fragments",s.fragments],["done",s.done],
    ["running",s.running],["pending",s.pending],["failed",s.failed],
    ["jobs/min", (s.rate_per_min||0).toFixed(s.rate_per_min>=10?0:1)]];
  const c=$("#cards"); c.innerHTML="";
  cards.forEach(([k,n])=>{ const d=el("div","card"); d.appendChild(el("div","n",esc(n))); d.appendChild(el("div","k",k)); c.appendChild(d); });
}

const openStages = new Set();
async function loadJobs(){
  const d = await getJSON("/api/jobs?"+qi()+"&limit=200");
  const tb=$("#jobs"); tb.innerHTML="";
  const jobs=d.jobs||[];
  if(!jobs.length){ const tr=el("tr"); const td=el("td","empty","No jobs yet."); td.colSpan=9; tr.appendChild(td); tb.appendChild(tr); return; }
  for(const j of jobs){
    const tr=el("tr");
    const stages=j.stages||[];
    // expand toggle
    const ex=el("td");
    if(stages.length){ const t=el("span","expand", openStages.has(j.id)?"▾":"▸"); t.onclick=()=>{ openStages.has(j.id)?openStages.delete(j.id):openStages.add(j.id); loadJobs(); }; ex.appendChild(t); }
    tr.appendChild(ex);
    tr.appendChild(el("td",null,"#"+j.id));
    const st=el("td"); st.appendChild(el("span","badge "+j.state, j.state)); tr.appendChild(st);
    const md=el("td"); if(j.mode){ md.appendChild(el("span","badge "+j.mode, j.mode)); } tr.appendChild(md);
    const u=el("td","url",j.url); u.title=(j.title?j.title+"\n":"")+j.url; tr.appendChild(u);
    tr.appendChild(el("td",null, j.fragments?String(j.fragments):""));
    tr.appendChild(el("td","muted", j.state==="pending"||j.state==="running"?eta(j.eta_seconds):(j.finished_at?ago(j.finished_at):"")));
    const det=el("td"); if(j.state==="error"){ det.className="err"; det.textContent=j.error; } else if(j.title){ det.className="muted"; det.textContent=j.title; }
    tr.appendChild(det);
    const act=el("td","actions");
    if(j.state==="error"||j.state==="done"){ const rb=el("button",null,"Retry"); rb.onclick=()=>jobAction("retry",j.id); act.appendChild(rb); }
    if(j.state==="pending"){ const cb=el("button",null,"Cancel"); cb.onclick=()=>jobAction("cancel",j.id); act.appendChild(cb); }
    tr.appendChild(act);
    tb.appendChild(tr);
    // expanded stages row
    if(stages.length && openStages.has(j.id)){
      const sr=el("tr","stages"); const sc=el("td"); sc.colSpan=9;
      const list=el("div","stagelist");
      for(const s of stages){
        const chip=el("div","stage "+s.state);
        chip.appendChild(el("span","dot"));
        chip.appendChild(el("span","nm", s.name));
        if(s.engine) chip.appendChild(el("span","eng2", s.engine));
        if(s.detail){ const dt=el("span","muted"); dt.textContent="· "+s.detail; chip.appendChild(dt); }
        chip.title = s.detail || "";
        list.appendChild(chip);
      }
      sc.appendChild(list); sr.appendChild(sc); tb.appendChild(sr);
    }
  }
}
async function jobAction(kind,id){
  try{ await post("/api/jobs/"+kind+"?"+qi(),{id}); toast("job #"+id+" "+kind+(kind==="retry"?"ied":"ed")); await Promise.all([loadJobs(),loadStatus()]); }
  catch(e){ toast(esc(e.message)); }
}

async function loadDocs(){
  const d = await getJSON("/api/documents?"+qi());
  const box=$("#docs"); box.innerHTML="";
  const docs=d.documents||[];
  if(!docs.length){ box.appendChild(el("div","empty","No documents indexed.")); return; }
  for(const doc of docs){
    const row=el("div","doc-row"); if(doc.path===curDoc) row.classList.add("sel");
    const t=el("div","doc-title"); t.appendChild(el("div",null,doc.title||doc.path.split("/").pop()));
    const sub=el("small"); sub.textContent=doc.path; t.appendChild(sub); row.appendChild(t);
    const meta=el("div","muted"); meta.style.textAlign="right"; meta.style.fontSize="12px";
    meta.appendChild(el("div",null,doc.fragments+" frags"));
    if(doc.pages){ const eng=el("div"); eng.innerHTML =
      (doc.vision?`<span class="badge vision">${doc.vision} vision</span> `:"") +
      ((doc.pages-doc.vision)>0?`<span class="badge text">${doc.pages-doc.vision} text</span>`:""); meta.appendChild(eng); }
    row.appendChild(meta);
    row.dataset.path = doc.path;
    row.onclick=()=>go("documents", doc.path, "pages");
    box.appendChild(row);
  }
}

// ── document detail ─────────────────────────────────────────────────────────
// One document, in tabs, off ONE call. The join lives server-side (docdetail.go)
// because the interesting part is the relation between these sections — a
// transcript means something different when two of its pages were corrected by
// hand, and a near-duplicate means something different when somebody already
// ruled the pair a copy.
let detailData = null;
// detailTab mirrors the route rather than being its own state: two places
// remembering which tab is open is two places to disagree after a back button.
Object.defineProperty(window, "detailTab", {get:()=>route.sub, set(v){ route.sub=v; }});

async function loadReview(){
  const box=$("#detail"); box.innerHTML='<div class="empty">loading…</div>';
  let d;
  try { d = await getJSON("/api/doc-detail?"+qi()+"&path="+encodeURIComponent(curDoc)); }
  catch(e){ box.innerHTML=""; box.appendChild(el("div","empty","Cannot read this document: "+esc(e.message))); return; }
  detailData = d;
  box.innerHTML="";

  const head=el("div"); head.style.padding="12px 14px";
  // Only visible on a narrow screen, where the list is collapsed and there is
  // otherwise no way back to it but the browser's own button.
  const back=el("button","backlink","← all documents");
  back.onclick=()=>go("documents");
  head.appendChild(back);
  head.appendChild(el("div"));
  head.appendChild(el("strong",null,d.title||d.path.split("/").pop()));
  const sub=el("div","muted"); sub.textContent=d.path+"  ·  "+(d.kind||"");
  head.appendChild(sub);
  const acts=el("div","docacts");
  if(d.original){
    const a=el("a",null,"download original");
    a.href=d.original; a.setAttribute("download","");
    acts.appendChild(a);
  }
  // Two different re-reads, named apart because they are not the same act and
  // the difference is what you get back. Re-ingest re-fragments and re-indexes
  // from the file as it stands; re-read purges the cached page OCR first, which
  // is the one that matters when the cache is what is wrong — a re-index alone
  // returns the same answer from the same cache.
  // Work already queued for this document DISABLES both, and says why. The queue
  // does not dedupe, so a button that stays live while a job runs is an
  // invitation to start the same minutes-long VLM pass three times.
  const busy = (d.in_flight||[]);
  const mkAct=(label,fn)=>{
    const b=el("button",null,label);
    if(busy.length){ b.disabled=true; b.title="already "+busy[0].state+" for this document"; }
    else b.onclick=async()=>{ b.disabled=true; b.textContent="queued…";
      try{ await fn(); toast("queued"); await loadReview(); }
      catch(e){ toast(esc(e.message)); b.disabled=false; b.textContent=label; } };
    return b;
  };
  // fresh:true, not a plain re-ingest. Without it the unchanged-bytes fast path
  // and the cross-index pool both short-circuit, so pressing "re-ingest" on a
  // file nobody edited does nothing at all — which looks identical to a button
  // that is broken.
  acts.appendChild(mkAct("re-ingest", ()=>post("/ingest?"+qi(),{targets:[curDoc],fresh:true})));
  acts.appendChild(mkAct("re-read (purge OCR cache)", ()=>post("/api/reread?"+qi(),{path:curDoc})));
  if(busy.length){
    const n=el("span","badge vision", busy.length===1
      ? busy[0].state+" · job #"+busy[0].id
      : busy.length+" jobs "+busy[0].state);
    acts.appendChild(n);
  }
  head.appendChild(acts);
  box.appendChild(head);

  const tabs=el("nav","subtabs");
  const defs=[["pages","Pages"+(d.pages&&d.pages.length?" ("+d.pages.length+")":"")],
              ["transcript","Transcript"],
              ["seen","Seen in"+(d.seen_in&&d.seen_in.length?" ("+d.seen_in.length+")":"")],
              ["attest","Attestation"],
              ["history","History"+(d.history&&d.history.length?" ("+d.history.length+")":"")]];
  for(const [k,label] of defs){
    const b=el("button",null,label); if(k===detailTab) b.classList.add("on");
    b.onclick=()=>go("documents", curDoc, k);
    tabs.appendChild(b);
  }
  box.appendChild(tabs);

  const pane=el("div","dpane"); box.appendChild(pane);
  if(detailTab==="pages") renderPages(pane,d);
  else if(detailTab==="transcript") renderTranscript(pane,d);
  else if(detailTab==="seen") renderSeenIn(pane,d);
  else if(detailTab==="history") renderHistory(pane,d);
  else renderAttest(pane,d);
}

function renderPages(pane,d){
  const pages=d.pages||[];
  if(!pages.length){
    pane.appendChild(el("div","empty","No per-page reading. Born-digital text and plain files are indexed whole; a scanned sheet gets pages once it has been OCR'd or regioned."));
    return;
  }
  for(const p of pages){
    const card=el("div","pagecard");
    const left=el("div");
    if(p.image_url){
      // NOT loading="lazy". A page image has no intrinsic size until it loads,
      // and in this grid an unloaded one is zero-height — so the browser decides
      // it is not near the viewport, never fetches it, and it stays zero-height.
      // The lazy attribute deadlocks against its own effect. There is one
      // document open at a time here, so eager is also just correct.
      const img=el("img"); img.alt="page "+p.page; img.src=p.image_url;
      img.onerror=()=>{ img.replaceWith(el("div","muted","(page image failed to load)")); };
      img.onclick=()=>{ $("#lightimg").src=img.src; $("#lightbox").showModal(); };
      left.appendChild(img);
      // Re-OCR stays here rather than moving to the workbench: this is the
      // MACHINE having another go, which is a different act from a person
      // ruling on what it said, and conflating them would let a re-read look
      // like a review.
      const wrap=el("div","reocr");
      const btn=el("button",null,"Re-OCR (cascade)");
      const out=el("div","out");
      btn.onclick=async()=>{ btn.disabled=true; btn.textContent="running…";
        try{ const r=await post("/api/reocr?"+qi(),{path:curDoc,page:p.page});
          out.innerHTML=""; out.appendChild(el("div","ptext",r.text||"(empty)")); }
        catch(e){ out.innerHTML=""; out.appendChild(el("div","err",esc(e.message))); }
        finally{ btn.disabled=false; btn.textContent="Re-OCR (cascade)"; } };
      wrap.appendChild(btn); wrap.appendChild(out); left.appendChild(wrap);
    } else {
      left.appendChild(el("div","muted","(no page image)"));
    }
    card.appendChild(left);
    const right=el("div");
    const h=el("div","pagehead");
    h.appendChild(el("strong",null,"page "+p.page));
    if(p.source) h.appendChild(el("span","badge "+(p.source==="corrected"?"vision":"text"),p.source));
    if(p.engine) h.appendChild(el("span","badge eng",p.engine));
    right.appendChild(h);
    right.appendChild(el("div","ptext",p.text||"(no text on this page)"));
    if(p.read_by||p.read_at){
      const by=el("div","muted"); by.style.fontSize="11px";
      by.textContent=[p.read_by,p.read_at].filter(Boolean).join(" · ");
      right.appendChild(by);
    }
    card.appendChild(right);
    pane.appendChild(card);
  }
}

function renderTranscript(pane,d){
  if(!d.text){ pane.appendChild(el("div","empty","No indexed text.")); return; }
  const pre=el("pre"); pre.textContent=d.text; pane.appendChild(pre);
}

function renderSeenIn(pane,d){
  const hits=d.seen_in||[];
  if(!hits.length){
    pane.appendChild(el("div","empty","Nothing overlapping. Sketches may not be built for this index yet — POST /api/similar/build."));
    return;
  }
  // Jaccard and BOTH containments, never one blended number: a deed inside a
  // title commitment is ~1.0 contained one way and ~0.05 Jaccard, and a single
  // score cannot say "wholly inside".
  const t=el("table","seen");
  t.innerHTML="<thead><tr><th>Document</th><th class=num>Jaccard</th><th class=num>of this</th>"+
    "<th class=num>of that</th><th>Computed</th><th>Ruled</th></tr></thead>";
  const tb=el("tbody");
  for(const h of hits){
    const tr=el("tr");
    const name=el("td"); name.textContent=h.path.split("/").pop();
    const full=el("div","muted"); full.style.fontSize="11px"; full.textContent=h.path; name.appendChild(full);
    tr.appendChild(name);
    for(const v of [h.jaccard,h.contain_probe,h.contain_match]){
      const td=el("td","num"); td.textContent=(v||0).toFixed(2); tr.appendChild(td);
    }
    tr.appendChild(el("td",null,h.relation||""));
    const ruled=el("td"); ruled.textContent=h.ruling||"—";
    if(!h.ruling) ruled.className="muted";
    tr.appendChild(ruled);
    tb.appendChild(tr);
  }
  t.appendChild(tb); pane.appendChild(t);
}

function renderHistory(pane,d){
  const h=d.history||[];
  if(!h.length){ pane.appendChild(el("div","empty","Nothing recorded yet — no corrections and no rulings.")); return; }
  const t=el("table","seen");
  t.innerHTML="<thead><tr><th>When</th><th>What</th><th>Who</th><th>Detail</th></tr></thead>";
  const tb=el("tbody");
  for(const e of h){
    const tr=el("tr");
    tr.appendChild(el("td","muted",e.at||"—"));
    // A superseded reading is kept and shown as superseded rather than hidden:
    // the old text is what the index held when this document was cited, and a
    // stale quotation elsewhere still matches it.
    const what=el("td");
    if(e.kind==="reading"){
      what.textContent = "page "+e.page+" · "+(e.source||"reading")+(e.active?"":" (superseded)");
    } else {
      what.textContent = "verdict · "+(e.source||"");
    }
    tr.appendChild(what);
    tr.appendChild(el("td",null,e.by||"—"));
    const det=el("td");
    if(e.note) det.appendChild(el("div",null,e.note));
    if(e.text){ const pre=el("div","muted"); pre.style.fontSize="12px"; pre.style.whiteSpace="pre-wrap";
      pre.textContent=e.text; det.appendChild(pre); }
    if(e.unit){ const u=el("div","muted"); u.style.fontSize="11px"; u.textContent=e.unit; det.appendChild(u); }
    tr.appendChild(det);
    tb.appendChild(tr);
  }
  t.appendChild(tb); pane.appendChild(t);
}

function renderAttest(pane,d){
  const a=d.attest;
  if(!a){
    pane.appendChild(el("div","empty","No reading recorded. Write one for the whole index with POST /api/attest/readings?index=…"));
    return;
  }
  // attest's own sentence, quoted. Paraphrasing a qualified claim changes what
  // was attested to, so this is never summarised into a percentage.
  if(a.provenance){ const p=el("div","prov"); p.textContent=a.provenance; pane.appendChild(p); }
  const dl=el("dl","kv");
  const rows=[["read by",a.producer],["units",a.total],["confirmed",a.confirmed],
    ["corrected",a.corrected],["affirmed",a.affirmed],["unclear",a.unclear],
    ["untouched",a.untouched],["rulings recorded",a.verdicts]];
  for(const [k,v] of rows){ dl.appendChild(el("dt",null,k)); dl.appendChild(el("dd",null,String(v==null?"":v))); }
  pane.appendChild(dl);
  if(a.workbench){
    const p=el("div"); p.style.marginTop="12px";
    const link=el("a",null,"open the review workbench →"); link.href=a.workbench;
    p.appendChild(link); pane.appendChild(p);
  }
}

async function refreshAll(){
  try{ await Promise.all([loadStatus(),loadJobs(),loadDocs()]); if(curDoc) await loadReview(); }
  catch(e){ toast(esc(e.message)); }
}

$("#index").onchange = e => { curIndex=e.target.value; curDoc=null;
  $("#detail").innerHTML='<div class="empty">Select a document.</div>';
  if(route.tab==="documents") go("documents");
  refreshAll(); };
$("#refresh").onclick = refreshAll;
$("#lightbox").onclick = () => $("#lightbox").close();

let timer=null;
function tick(){ if($("#auto").checked){ loadStatus().catch(()=>{}); loadJobs().catch(()=>{}); } }
$("#auto").onchange = ()=>{}; // polling always scheduled; checkbox gates the work
timer=setInterval(tick,3000);

document.querySelectorAll("#tabs button").forEach(b=>{ b.onclick=()=>go(b.dataset.tab); });
$("#searchForm").onsubmit = e => { e.preventDefault(); runSearch(); };
window.addEventListener("hashchange", applyRoute);
(async function init(){ await loadIndexes(); await refreshAll(); await applyRoute(); })();
</script>
</body>
</html>
